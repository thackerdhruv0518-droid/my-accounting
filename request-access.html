<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Request Access - My Accounting</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

.container {
    width: 100%;
    max-width: 450px;
    padding: 20px;
}

.box {
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

h1 {
    margin-top: 0;
    text-align: center;
}

p {
    color: #666;
    text-align: center;
}

.form-group {
    margin-top: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    border: none;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #000;
}

.back-button {
    background: #666;
}

#message {
    margin-top: 18px;
    min-height: 20px;
    text-align: center;
    font-weight: bold;
}

</style>

</head>


<body>

<div class="container">

    <div class="box">

        <h1>REQUEST ACCESS</h1>

        <p>
            Request access to My Accounting
        </p>


        <div class="form-group">

            <label>Your Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >

        </div>


        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

        </div>


        <button
            id="requestButton"
            onclick="sendRequest()"
        >
            SEND REQUEST
        </button>


        <button
            class="back-button"
            onclick="goBack()"
        >
            BACK TO LOGIN
        </button>


        <div id="message"></div>

    </div>

</div>


<script>

function showMessage(text, success = false) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.style.color =
        success
            ? "#2e7d32"
            : "#c62828";

}


async function sendRequest() {

    const name =
        document.getElementById("name")
            .value.trim();

    const email =
        document.getElementById("email")
            .value.trim()
            .toLowerCase();

    const button =
        document.getElementById("requestButton");


    if (!name || !email) {

        showMessage(
            "Please enter your name and email."
        );

        return;

    }


    button.disabled = true;

    button.innerText =
        "SENDING...";


    try {

        /* CHECK EXISTING REQUEST */

        const existing =
            await supabaseClient
                .from("access_requests")
                .select("id, status")
                .eq("email", email)
                .maybeSingle();


        if (existing.error) {

            throw existing.error;

        }


        if (existing.data) {

            if (
                existing.data.status ===
                "pending"
            ) {

                showMessage(
                    "Your request is already pending."
                );

            }

            else if (
                existing.data.status ===
                "approved"
            ) {

                showMessage(
                    "Your request is already approved. Please login."
                );

            }

            else {

                showMessage(
                    "Your request was rejected."
                );

            }

            return;

        }


        /* INSERT REQUEST */

        const result =
            await supabaseClient
                .from("access_requests")
                .insert([{

                    name: name,

                    email: email,

                    status: "pending"

                }]);


        if (result.error) {

            throw result.error;

        }


        showMessage(
            "✅ Request sent successfully! Please wait for approval.",
            true
        );


        document.getElementById(
            "name"
        ).value = "";

        document.getElementById(
            "email"
        ).value = "";


    }

    catch (error) {

        console.error(error);

        showMessage(
            "❌ " +
            error.message
        );

    }

    finally {

        button.disabled = false;

        button.innerText =
            "SEND REQUEST";

    }

}


function goBack() {

    window.location.href =
        "index.html";

}

</script>

</body>
</html>
