<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Request Access - My Accounting</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        p {
            color: #666;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

    </style>

</head>


<body>


<div class="box">

    <h1>🔐 MY ACCOUNTING</h1>

    <p>
        Request access to create your own
        personal accounting workspace.
    </p>


    <label>Your Name</label>

    <input
        type="text"
        id="fullName"
        placeholder="Enter your name"
    >


    <label>Email Address</label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
    >


    <button
        id="requestButton"
        onclick="requestAccess()"
    >
        REQUEST ACCESS
    </button>


    <div id="message"></div>


    <div class="login-link">

        Already have access?

        <br><br>

        <button onclick="goLogin()">
            LOGIN
        </button>

    </div>

</div>



<script>


async function requestAccess() {

    const fullName =
        document
            .getElementById("fullName")
            .value
            .trim();


    const email =
        document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


    const message =
        document.getElementById("message");


    const requestButton =
        document.getElementById("requestButton");


    if (!fullName || !email) {

        message.innerText =
            "Please enter your name and email.";

        return;

    }


    requestButton.disabled = true;

    requestButton.innerText =
        "SENDING...";


    try {

        /* CHECK EXISTING REQUEST */

        const {
            data: existingRequest,
            error: checkError
        } = await supabaseClient

            .from("access_requests")

            .select("id, status")

            .eq("email", email)

            .limit(1);


        if (checkError) {

            throw checkError;

        }


        if (
            existingRequest &&
            existingRequest.length > 0
        ) {

            const status =
                existingRequest[0].status;


            if (status === "pending") {

                message.innerText =
                    "⏳ Your access request is already pending.";

                return;

            }


            if (status === "approved") {

                message.innerText =
                    "✅ Your access is approved. Please login.";

                return;

            }

        }


        /* INSERT REQUEST */

        const {
            error
        } = await supabaseClient

            .from("access_requests")

            .insert({

                full_name: fullName,

                email: email,

                status: "pending"

            });


        if (error) {

            throw error;

        }


        message.innerText =
            "✅ Request sent successfully! Please wait for approval.";


        document
            .getElementById("fullName")
            .value = "";


        document
            .getElementById("email")
            .value = "";


    }

    catch (error) {

        console.error(error);

        message.innerText =
            "❌ Error: " +
            error.message;

    }

    finally {

        requestButton.disabled = false;

        requestButton.innerText =
            "REQUEST ACCESS";

    }

}


function goLogin() {

    window.location.href =
        "index.html";

}


</script>


</body>
</html>
