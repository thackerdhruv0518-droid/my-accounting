<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Category - My Accounting</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>


<body>


<div class="tally-report">


    <!-- HEADER -->

    <div class="report-header">

        <h1>MY ACCOUNTING</h1>

        <h2>Category Management</h2>

        <p>
            Main Category → Sub Category → Ledger Name
        </p>

    </div>



    <!-- =========================
         ADD MAIN CATEGORY
    ========================== -->

    <div class="transaction-box">

        <h3>Add Main Category</h3>

        <label>Main Category Name</label>

        <input
            type="text"
            id="mainCategoryName"
            placeholder="Example: Expenses"
        >

        <button onclick="addMainCategory()">
            ADD MAIN CATEGORY
        </button>

    </div>



    <!-- =========================
         ADD SUB CATEGORY
    ========================== -->

    <div class="transaction-box">

        <h3>Add Sub Category</h3>

        <label>Main Category</label>

        <select id="subMainCategory">

            <option value="">
                Loading Categories...
            </option>

        </select>


        <label>Sub Category Name</label>

        <input
            type="text"
            id="subCategoryName"
            placeholder="Example: Office Expenses"
        >


        <button onclick="addSubCategory()">
            ADD SUB CATEGORY
        </button>

    </div>



    <!-- =========================
         ADD LEDGER
    ========================== -->

    <div class="transaction-box">

        <h3>Add Ledger Name</h3>


        <label>Main Category</label>

        <select
            id="ledgerMainCategory"
            onchange="loadLedgerSubCategories()"
        >

            <option value="">
                Select Main Category
            </option>

        </select>


        <label>Sub Category</label>

        <select id="ledgerSubCategory">

            <option value="">
                Select Main Category First
            </option>

        </select>


        <label>Ledger Name</label>

        <input
            type="text"
            id="ledgerName"
            placeholder="Example: Rent"
        >


        <button onclick="addLedger()">
            ADD LEDGER
        </button>

    </div>



    <!-- =========================
         BACK BUTTON
    ========================== -->

    <div class="report-buttons">

        <button onclick="goDashboard()">
            BACK TO DASHBOARD
        </button>

    </div>


    <p
        id="categoryMessage"
        class="transaction-message"
    ></p>


</div>



<script>


/* =====================================
   MESSAGE
===================================== */

function showMessage(text) {

    document.getElementById(
        "categoryMessage"
    ).innerText = text;

}



/* =====================================
   LOAD MAIN CATEGORIES
===================================== */

async function loadCategories() {


    const subSelect =
        document.getElementById(
            "subMainCategory"
        );


    const ledgerSelect =
        document.getElementById(
            "ledgerMainCategory"
        );


    const { data, error } =
        await supabaseClient
            .from("categories")
            .select("*")
            .order("name");


    if (error) {

        console.error(error);

        showMessage(
            "Error loading categories: " +
            error.message
        );

        return;

    }


    subSelect.innerHTML =
        '<option value="">Select Main Category</option>';


    ledgerSelect.innerHTML =
        '<option value="">Select Main Category</option>';


    data.forEach(function(category) {


        const option1 =
            document.createElement("option");

        option1.value = category.id;
        option1.text = category.name;

        subSelect.appendChild(option1);



        const option2 =
            document.createElement("option");

        option2.value = category.id;
        option2.text = category.name;

        ledgerSelect.appendChild(option2);


    });


}



/* =====================================
   ADD MAIN CATEGORY
===================================== */

async function addMainCategory() {


    const input =
        document.getElementById(
            "mainCategoryName"
        );


    const name =
        input.value.trim();


    if (!name) {

        showMessage(
            "Please enter Main Category name."
        );

        return;

    }


    const { error } =
        await supabaseClient
            .from("categories")
            .insert([
                {
                    name: name
                }
            ]);


    if (error) {

        showMessage(
            "Error: " +
            error.message
        );

        return;

    }


    input.value = "";


    showMessage(
        "Main Category added successfully!"
    );


    loadCategories();


}



/* =====================================
   ADD SUB CATEGORY
===================================== */

async function addSubCategory() {


    const categoryId =
        document.getElementById(
            "subMainCategory"
        ).value;


    const input =
        document.getElementById(
            "subCategoryName"
        );


    const name =
        input.value.trim();


    if (!categoryId || !name) {

        showMessage(
            "Select Main Category and enter Sub Category."
        );

        return;

    }


    const { error } =
        await supabaseClient
            .from("sub_categories")
            .insert([
                {
                    category_id: categoryId,
                    name: name
                }
            ]);


    if (error) {

        showMessage(
            "Error: " +
            error.message
        );

        return;

    }


    input.value = "";


    showMessage(
        "Sub Category added successfully!"
    );


}



/* =====================================
   LOAD SUB CATEGORIES
===================================== */

async function loadLedgerSubCategories() {


    const categoryId =
        document.getElementById(
            "ledgerMainCategory"
        ).value;


    const select =
        document.getElementById(
            "ledgerSubCategory"
        );


    if (!categoryId) {

        select.innerHTML =
            '<option value="">Select Main Category First</option>';

        return;

    }


    select.innerHTML =
        '<option value="">Loading...</option>';


    const { data, error } =
        await supabaseClient
            .from("sub_categories")
            .select("*")
            .eq(
                "category_id",
                categoryId
            )
            .order("name");


    if (error) {

        showMessage(
            "Error: " +
            error.message
        );

        return;

    }


    select.innerHTML =
        '<option value="">Select Sub Category</option>';


    if (data.length === 0) {

        select.innerHTML =
            '<option value="">No Sub Categories Found</option>';

        return;

    }


    data.forEach(function(subCategory) {


        const option =
            document.createElement("option");

        option.value =
            subCategory.id;

        option.text =
            subCategory.name;

        select.appendChild(option);


    });


}



/* =====================================
   ADD LEDGER
===================================== */

async function addLedger() {


    const subCategoryId =
        document.getElementById(
            "ledgerSubCategory"
        ).value;


    const input =
        document.getElementById(
            "ledgerName"
        );


    const name =
        input.value.trim();


    if (!subCategoryId || !name) {

        showMessage(
            "Select Sub Category and enter Ledger Name."
        );

        return;

    }


    const { error } =
        await supabaseClient
            .from("ledgers")
            .insert([
                {
                    sub_category_id: subCategoryId,
                    name: name
                }
            ]);


    if (error) {

        showMessage(
            "Error: " +
            error.message
        );

        return;

    }


    input.value = "";


    showMessage(
        "Ledger added successfully!"
    );


}



/* =====================================
   BACK TO DASHBOARD
===================================== */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}



/* =====================================
   START
===================================== */

loadCategories();


</script>


</body>

</html>
