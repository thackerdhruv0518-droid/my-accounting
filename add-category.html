<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Categories - My Accounting</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>


<body>


<div class="tally-report">

    <div class="report-header">

        <h1>MY ACCOUNTING</h1>

        <h2>Categories</h2>

        <p>Create Main Category and Sub Category</p>

    </div>


    <!-- ADD MAIN CATEGORY -->

    <div class="transaction-box">

        <label>
            Main Category
        </label>

        <input
            type="text"
            id="categoryName"
            placeholder="Example: Monthly Expense"
        >

    </div>


    <div class="report-buttons">

        <button onclick="addCategory()">
            ADD MAIN CATEGORY
        </button>

    </div>


    <p
        id="categoryMessage"
        class="transaction-message"
    ></p>


    <!-- ADD SUB CATEGORY -->

    <div class="transaction-box">

        <label>
            Select Main Category
        </label>

        <select id="parentCategory">

            <option value="">
                Select Main Category
            </option>

        </select>


        <label>
            Sub Category
        </label>

        <input
            type="text"
            id="subCategoryName"
            placeholder="Example: Rent"
        >

    </div>


    <div class="report-buttons">

        <button onclick="addSubCategory()">
            ADD SUB CATEGORY
        </button>

        <button onclick="goDashboard()">
            BACK TO DASHBOARD
        </button>

    </div>


    <p
        id="subCategoryMessage"
        class="transaction-message"
    ></p>


    <!-- CATEGORY LIST -->

    <div id="categoryList"></div>


</div>



<script>


/* =========================================
   GLOBAL DATA
========================================= */

let categories = [];


/* =========================================
   LOAD CATEGORIES
========================================= */

async function loadCategories() {


    const {
        data,
        error
    } = await supabaseClient

        .from("categories")

        .select("*")

        .order("name");


    if (error) {

        console.error(error);

        return;

    }


    categories = data;


    const select =
        document.getElementById(
            "parentCategory"
        );


    select.innerHTML =
        `<option value="">
            Select Main Category
        </option>`;


    categories.forEach(
        function(category) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                category.id;


            option.text =
                category.name;


            select.appendChild(
                option
            );

        }
    );


    showCategories();

}


/* =========================================
   ADD MAIN CATEGORY
========================================= */

async function addCategory() {


    const name =
        document.getElementById(
            "categoryName"
        ).value.trim();


    const message =
        document.getElementById(
            "categoryMessage"
        );


    if (!name) {

        message.innerText =
            "Please enter category name.";

        return;

    }


    const {
        error
    } = await supabaseClient

        .from("categories")

        .insert([

            {
                name: name
            }

        ]);


    if (error) {

        console.error(error);

        message.innerText =
            "Error: " +
            error.message;

        return;

    }


    message.innerText =
        "Main Category added successfully!";


    document.getElementById(
        "categoryName"
    ).value = "";


    loadCategories();

}


/* =========================================
   ADD SUB CATEGORY
========================================= */

async function addSubCategory() {


    const categoryId =
        document.getElementById(
            "parentCategory"
        ).value;


    const name =
        document.getElementById(
            "subCategoryName"
        ).value.trim();


    const message =
        document.getElementById(
            "subCategoryMessage"
        );


    if (
        !categoryId ||
        !name
    ) {

        message.innerText =
            "Select Main Category and enter Sub Category.";

        return;

    }


    const {
        error
    } = await supabaseClient

        .from("sub_categories")

        .insert([

            {
                category_id:
                    categoryId,

                name:
                    name
            }

        ]);


    if (error) {

        console.error(error);

        message.innerText =
            "Error: " +
            error.message;

        return;

    }


    message.innerText =
        "Sub Category added successfully!";


    document.getElementById(
        "subCategoryName"
    ).value = "";


    showCategories();

}


/* =========================================
   SHOW CATEGORY LIST
========================================= */

async function showCategories() {


    const list =
        document.getElementById(
            "categoryList"
        );


    list.innerHTML = "";


    for (
        const category
        of categories
    ) {


        const {
            data: subCategories,
            error
        } = await supabaseClient

            .from("sub_categories")

            .select("*")

            .eq(
                "category_id",
                category.id
            )

            .order("name");


        const box =
            document.createElement(
                "div"
            );


        box.style.marginTop =
            "20px";


        box.style.border =
            "1px solid #333";


        box.style.padding =
            "15px";


        let html = `

            <strong>
                ${category.name}
            </strong>

        `;


        if (
            subCategories &&
            subCategories.length > 0
        ) {


            html +=
                "<ul>";


            subCategories.forEach(
                function(sub) {


                    html += `

                        <li>
                            ${sub.name}
                        </li>

                    `;

                }
            );


            html +=
                "</ul>";

        }

        else {


            html += `

                <p>
                    No Sub Categories
                </p>

            `;

        }


        box.innerHTML =
            html;


        list.appendChild(
            box
        );

    }

}


/* =========================================
   BACK
========================================= */

function goDashboard() {


    window.location.href =
        "dashboard.html";

}


/* =========================================
   START
========================================= */

loadCategories();


</script>


</body>

</html>
