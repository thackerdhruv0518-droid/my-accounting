<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account Ledger - My Accounting</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <!-- LEDGER EXTRA STYLE -->

    <style>

        .ledger-summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin:
                20px 0;

        }


        .ledger-card {

            border:
                1px solid #ccc;

            border-radius:
                8px;

            padding:
                15px;

            text-align:
                center;

            background:
                white;

        }


        .ledger-card h3 {

            margin:
                0 0 8px 0;

            font-size:
                14px;

        }


        .ledger-card p {

            margin: 0;

            font-size:
                20px;

            font-weight:
                bold;

        }


        .ledger-account-name {

            text-align:
                center;

            margin:
                10px 0 20px 0;

            font-size:
                18px;

            font-weight:
                bold;

        }


        .ledger-actions {

            display:
                flex;

            justify-content:
                center;

            gap:
                8px;

            flex-wrap:
                wrap;

        }


        .edit-btn {

            padding:
                7px 12px;

            cursor:
                pointer;

            border:
                none;

            border-radius:
                5px;

            font-size:
                12px;

        }


        .delete-btn {

            padding:
                7px 12px;

            cursor:
                pointer;

            border:
                none;

            border-radius:
                5px;

            font-size:
                12px;

        }


        .ledger-description {

            font-weight:
                500;

        }


        @media (
            max-width: 600px
        ) {

            .ledger-summary {

                grid-template-columns:
                    1fr;

            }


            .pnl-table {

                font-size:
                    12px;

            }


            .ledger-actions {

                flex-direction:
                    column;

            }

        }

    </style>

</head>


<body>


<div class="tally-report">


    <!-- HEADER -->

    <div class="report-header">

        <h1>MY ACCOUNTING</h1>

        <h2>
            Account Ledger
        </h2>

        <p>
            Detailed Account Transactions
        </p>

    </div>



    <!-- ACCOUNT NAME -->

    <div
        id="accountTitle"
        class="ledger-account-name"
    >
        Account Ledger
    </div>



    <!-- SUMMARY -->

    <div class="ledger-summary">


        <div class="ledger-card">

            <h3>
                TOTAL DEBIT
            </h3>

            <p id="summaryDebit">
                ₹0.00
            </p>

        </div>



        <div class="ledger-card">

            <h3>
                TOTAL CREDIT
            </h3>

            <p id="summaryCredit">
                ₹0.00
            </p>

        </div>



        <div class="ledger-card">

            <h3>
                BALANCE
            </h3>

            <p id="summaryBalance">
                ₹0.00
            </p>

        </div>


    </div>



    <!-- LEDGER TABLE -->

    <div
        style="
            overflow-x:auto;
        "
    >

        <table class="pnl-table">


            <thead>

                <tr>

                    <th>
                        Date
                    </th>

                    <th>
                        Particulars
                    </th>

                    <th>
                        Debit (Dr.)
                    </th>

                    <th>
                        Credit (Cr.)
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>



            <tbody id="ledgerBody">

                <tr>

                    <td
                        colspan="5"
                        style="
                            text-align:center;
                            padding:20px;
                        "
                    >
                        Loading Ledger...
                    </td>

                </tr>

            </tbody>



            <tfoot>

                <tr>

                    <th colspan="2">
                        TOTAL
                    </th>

                    <th
                        id="totalDebit"
                        class="amount"
                    >
                        ₹0.00
                    </th>

                    <th
                        id="totalCredit"
                        class="amount"
                    >
                        ₹0.00
                    </th>

                    <th>
                        -
                    </th>

                </tr>

            </tfoot>


        </table>

    </div>



    <!-- BUTTON -->

    <div class="report-buttons">

        <button onclick="goBack()">
            BACK TO TRIAL BALANCE
        </button>

    </div>


</div>



<script>


/* =========================================
   GET ACCOUNT NAME
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const accountName =
    params.get("account");


document.getElementById(
    "accountTitle"
).innerText =

    accountName
        ? accountName + " Ledger"
        : "Account Ledger";



/* =========================================
   FORMAT DATE
========================================= */

function formatDate(dateString) {


    if (!dateString) {

        return "";

    }


    const date =
        new Date(dateString);


    return date
        .toLocaleDateString(
            "en-GB"
        );


}



/* =========================================
   LOAD LEDGER
========================================= */

async function loadLedger() {


    const body =
        document.getElementById(
            "ledgerBody"
        );


    body.innerHTML = `

        <tr>

            <td
                colspan="5"
                style="
                    text-align:center;
                    padding:20px;
                "
            >
                Loading Ledger...
            </td>

        </tr>

    `;


    if (!accountName) {


        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    style="
                        text-align:center;
                        padding:20px;
                    "
                >
                    Account not selected
                </td>

            </tr>

        `;


        return;

    }


    const {

        data,

        error

    } = await supabaseClient

        .from("transactions")

        .select("*")

        .eq(
            "sub_category",
            accountName
        )

        .order(
            "transaction_date",
            {
                ascending: false
            }
        );


    if (error) {


        console.error(error);


        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    style="
                        text-align:center;
                        padding:20px;
                    "
                >
                    Error loading ledger
                </td>

            </tr>

        `;


        return;

    }


    if (
        !data ||
        data.length === 0
    ) {


        body.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    style="
                        text-align:center;
                        padding:20px;
                    "
                >
                    No transactions found
                </td>

            </tr>

        `;


        document.getElementById(
            "totalDebit"
        ).innerText =
            "₹0.00";


        document.getElementById(
            "totalCredit"
        ).innerText =
            "₹0.00";


        return;

    }


    body.innerHTML = "";


    let totalDebit = 0;

    let totalCredit = 0;


    data.forEach(
        function(transaction) {


            const amount =
                Number(
                    transaction.amount
                ) || 0;


            let debit = "";

            let credit = "";


            if (
                transaction.entry_type ===
                "debit"
            ) {


                debit =
                    "₹" +
                    amount.toFixed(2);


                totalDebit +=
                    amount;

            }


            else if (
                transaction.entry_type ===
                "credit"
            ) {


                credit =
                    "₹" +
                    amount.toFixed(2);


                totalCredit +=
                    amount;

            }


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${
                        formatDate(
                            transaction.transaction_date
                        )
                    }
                </td>


                <td>

                    <div
                        class="ledger-description"
                    >

                        ${
                            transaction.description ||
                            "-"
                        }

                    </div>


                    ${
                        transaction.notes

                            ? `

                                <small>

                                    ${
                                        transaction.notes
                                    }

                                </small>

                            `

                            : ""

                    }

                </td>


                <td
                    class="amount"
                >
                    ${debit}
                </td>


                <td
                    class="amount"
                >
                    ${credit}
                </td>


                <td>

                    <div
                        class="ledger-actions"
                    >

                        <button
                            class="edit-btn"
                            onclick="
                                editTransaction(
                                    '${transaction.id}'
                                )
                            "
                        >
                            EDIT
                        </button>


                        <button
                            class="delete-btn"
                            onclick="
                                deleteTransaction(
                                    '${transaction.id}'
                                )
                            "
                        >
                            DELETE
                        </button>

                    </div>

                </td>

            `;


            body.appendChild(
                row
            );


        }
    );



    /* TOTALS */


    document.getElementById(
        "totalDebit"
    ).innerText =

        "₹" +
        totalDebit.toFixed(2);


    document.getElementById(
        "totalCredit"
    ).innerText =

        "₹" +
        totalCredit.toFixed(2);



    /* SUMMARY */


    document.getElementById(
        "summaryDebit"
    ).innerText =

        "₹" +
        totalDebit.toFixed(2);


    document.getElementById(
        "summaryCredit"
    ).innerText =

        "₹" +
        totalCredit.toFixed(2);


    const balance =
        totalDebit -
        totalCredit;


    document.getElementById(
        "summaryBalance"
    ).innerText =

        "₹" +
        Math.abs(
            balance
        ).toFixed(2) +

        (
            balance > 0

                ? " Dr."

                : balance < 0

                    ? " Cr."

                    : ""
        );


}



/* =========================================
   EDIT TRANSACTION
========================================= */

function editTransaction(id) {


    window.location.href =

        "add-transaction.html?id=" +

        encodeURIComponent(id) +

        "&account=" +

        encodeURIComponent(
            accountName
        );


}



/* =========================================
   DELETE TRANSACTION
========================================= */

async function deleteTransaction(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this transaction?"
        );


    if (!confirmDelete) {

        return;

    }


    const {

        error

    } = await supabaseClient

        .from("transactions")

        .delete()

        .eq(
            "id",
            id
        );


    if (error) {


        console.error(error);


        alert(
            "Error deleting transaction: " +
            error.message
        );


        return;

    }


    alert(
        "Transaction deleted successfully!"
    );


    loadLedger();


}



/* =========================================
   BACK
========================================= */

function goBack() {


    window.location.href =
        "trial-balance.html";


}



/* =========================================
   START
========================================= */

loadLedger();


</script>


</body>

</html>
