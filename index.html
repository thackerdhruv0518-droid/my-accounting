<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - My Accounting</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

.login-container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.login-box {
    background: white;
    padding: 40px 35px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

.login-header {
    text-align: center;
    margin-bottom: 30px;
}

.login-header h1 {
    margin: 0;
    font-size: 30px;
}

.login-header p {
    margin-top: 10px;
    color: #777;
    font-size: 14px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #222;
}

.remember-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
}

.remember-box input {
    width: auto;
}

.remember-box label {
    margin: 0;
}

.login-button,
.request-button {
    width: 100%;
    border: none;
    padding: 15px;
    color: white;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.login-button {
    background: #222;
}

.request-button {
    background: #555;
    margin-top: 12px;
}

.login-button:hover {
    background: #000;
}

.request-button:hover {
    background: #333;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#loginMessage {
    text-align: center;
    margin-top: 18px;
    min-height: 20px;
    font-size: 14px;
}

</style>

</head>


<body>

<div class="login-container">

    <div class="login-box">

        <div class="login-header">

            <h1>MY ACCOUNTING</h1>

            <p>
                Login to your personal accounting system
            </p>

        </div>


        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

        </div>


        <div class="remember-box">

            <input
                type="checkbox"
                id="rememberMe"
                checked
            >

            <label for="rememberMe">
                Remember me
            </label>

        </div>


        <button
            id="loginButton"
            class="login-button"
            onclick="login()"
        >
            LOGIN
        </button>


        <button
            class="request-button"
            onclick="requestAccess()"
        >
            REQUEST ACCESS
        </button>


        <p id="loginMessage"></p>

    </div>

</div>


<script>

const OWNER_EMAIL =
    "thackerdhruv39@gmail.com";


/* MESSAGE */

function showMessage(text, success = false) {

    const message =
        document.getElementById(
            "loginMessage"
        );

    message.innerText = text;

    message.style.color =
        success
            ? "#2e7d32"
            : "#c62828";
}


/* CHECK USER ACCESS */

async function checkUserAccess(user) {

    if (!user) {
        return false;
    }


    /* OWNER */

    if (
        user.email &&
        user.email.toLowerCase() ===
        OWNER_EMAIL.toLowerCase()
    ) {
        return true;
    }


    /* CHECK PROFILE */

    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("is_approved")
            .eq("id", user.id)
            .maybeSingle();


    if (error) {

        console.error(
            "Access check error:",
            error
        );

        return false;
    }


    if (
        data &&
        data.is_approved === true
    ) {
        return true;
    }


    return false;
}


/* EXISTING LOGIN */

async function checkLogin() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if (
            error ||
            !data.session
        ) {
            return;
        }


        const user =
            data.session.user;


        const allowed =
            await checkUserAccess(
                user
            );


        if (allowed) {

            window.location.href =
                "dashboard.html";

        }

        else {

            await supabaseClient
                .auth
                .signOut();

            localStorage.removeItem(
                "rememberMe"
            );

        }

    }

    catch (error) {

        console.error(
            "Session error:",
            error
        );

    }

}


/* LOGIN */

async function login() {

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const rememberMe =
        document.getElementById(
            "rememberMe"
        ).checked;


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    if (
        !email ||
        !password
    ) {

        showMessage(
            "Please enter email and password."
        );

        return;
    }


    loginButton.disabled = true;

    loginButton.innerText =
        "LOGGING IN...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            showMessage(
                error.message
            );

            return;
        }


        if (!data.user) {

            showMessage(
                "Login failed."
            );

            return;
        }


        const allowed =
            await checkUserAccess(
                data.user
            );


        if (!allowed) {

            await supabaseClient
                .auth
                .signOut();


            showMessage(
                "Your account is not approved yet."
            );

            return;
        }


        if (rememberMe) {

            localStorage.setItem(
                "rememberMe",
                "true"
            );

        }

        else {

            localStorage.removeItem(
                "rememberMe"
            );

        }


        showMessage(
            "Login successful!",
            true
        );


        setTimeout(
            function() {

                window.location.href =
                    "dashboard.html";

            },
            500
        );

    }

    catch (error) {

        console.error(error);

        showMessage(
            "Something went wrong."
        );

    }

    finally {

        loginButton.disabled =
            false;

        loginButton.innerText =
            "LOGIN";

    }

}


/* REQUEST ACCESS */

function requestAccess() {

    window.location.href =
        "request-access.html";

}


/* ENTER KEY */

document
    .getElementById("password")
    .addEventListener(
        "keypress",
        function(event) {

            if (
                event.key === "Enter"
            ) {
                login();
            }

        }
    );


checkLogin();

</script>

</body>
</html>
