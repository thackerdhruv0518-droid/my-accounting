<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - My Accounting</title>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <!-- LOGIN PAGE CSS -->

    <style>

        * {

            box-sizing:
                border-box;

        }


        body {

            margin:
                0;

            min-height:
                100vh;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            font-family:
                Arial,
                sans-serif;

            background:
                #f4f6f9;

            color:
                #222;

        }


        .login-container {

            width:
                100%;

            max-width:
                420px;

            padding:
                20px;

        }


        .login-box {

            background:
                #ffffff;

            padding:
                40px 35px;

            border-radius:
                15px;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.12);

        }


        .login-header {

            text-align:
                center;

            margin-bottom:
                30px;

        }


        .login-header h1 {

            margin:
                0;

            font-size:
                30px;

            letter-spacing:
                1px;

            color:
                #222;

        }


        .login-header p {

            margin:
                10px 0 0;

            color:
                #777;

            font-size:
                14px;

        }


        .form-group {

            margin-bottom:
                20px;

        }


        label {

            display:
                block;

            margin-bottom:
                8px;

            font-size:
                14px;

            font-weight:
                bold;

            color:
                #333;

        }


        input {

            width:
                100%;

            padding:
                14px;

            border:
                1px solid
                #ddd;

            border-radius:
                8px;

            font-size:
                15px;

            outline:
                none;

        }


        input:focus {

            border-color:
                #222;

        }


        /* REMEMBER ME */

        .remember-box {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            margin-bottom:
                20px;

        }


        .remember-box input {

            width:
                auto;

            padding:
                0;

            cursor:
                pointer;

        }


        .remember-box label {

            margin:
                0;

            font-size:
                14px;

            cursor:
                pointer;

        }


        .login-button {

            width:
                100%;

            border:
                none;

            padding:
                15px;

            background:
                #222;

            color:
                white;

            border-radius:
                8px;

            font-size:
                15px;

            font-weight:
                bold;

            cursor:
                pointer;

        }


        .login-button:hover {

            background:
                #000;

        }


        .login-button:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

        }


        #loginMessage {

            text-align:
                center;

            margin-top:
                18px;

            margin-bottom:
                0;

            font-size:
                14px;

            min-height:
                20px;

            color:
                #c62828;

        }


        @media (
            max-width:
            480px
        ) {

            .login-container {

                padding:
                    15px;

            }


            .login-box {

                padding:
                    30px 22px;

            }


            .login-header h1 {

                font-size:
                    25px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-box">


        <!-- HEADER -->

        <div class="login-header">

            <h1>
                MY ACCOUNTING
            </h1>

            <p>
                Login to your personal accounting system
            </p>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

        </div>


        <!-- REMEMBER ME -->

        <div class="remember-box">

            <input
                type="checkbox"
                id="rememberMe"
                checked
            >

            <label for="rememberMe">
                Remember me
            </label>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            id="loginButton"
            class="login-button"
            onclick="login()"
        >
            LOGIN
        </button>


        <!-- MESSAGE -->

        <p id="loginMessage"></p>


    </div>

</div>


<script>


/* =====================================
   CHECK EXISTING LOGIN
===================================== */

async function checkLogin() {


    const {

        data,

        error

    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(error);

        return;

    }


    const rememberMe =
        localStorage.getItem(
            "rememberMe"
        );


    if (
        data.session &&
        rememberMe === "true"
    ) {

        window.location.href =
            "dashboard.html";

    }


}



/* =====================================
   LOGIN
===================================== */

async function login() {


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const rememberMe =
        document.getElementById(
            "rememberMe"
        ).checked;


    const message =
        document.getElementById(
            "loginMessage"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    if (
        !email ||
        !password
    ) {

        message.innerText =
            "Please enter email and password.";

        return;

    }


    loginButton.disabled =
        true;


    loginButton.innerText =
        "LOGGING IN...";


    message.innerText =
        "";


    try {


        const {

            data,

            error

        } = await supabaseClient.auth.signInWithPassword({

            email:
                email,

            password:
                password

        });


        if (error) {

            message.innerText =
                error.message;

            return;

        }


        /* SAVE REMEMBER SETTING */

        if (rememberMe) {

            localStorage.setItem(
                "rememberMe",
                "true"
            );

        }

        else {

            localStorage.removeItem(
                "rememberMe"
            );

        }


        if (data.user) {

            message.style.color =
                "#2e7d32";


            message.innerText =
                "Login successful!";


            setTimeout(
                function() {

                    window.location.href =
                        "dashboard.html";

                },
                500
            );

        }


    }

    catch (error) {

        console.error(error);

        message.innerText =
            "Something went wrong. Please try again.";

    }

    finally {

        loginButton.disabled =
            false;

        loginButton.innerText =
            "LOGIN";

    }

}


/* ENTER KEY */

document
    .getElementById("password")
    .addEventListener(
        "keypress",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                login();

            }

        }
    );


/* START */

checkLogin();


</script>


</body>

</html>
