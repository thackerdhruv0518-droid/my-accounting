<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Transaction - My Accounting</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

</head>

<body>

<div class="tally-report">

    <!-- HEADER -->

    <div class="report-header">

        <h1>MY ACCOUNTING</h1>

        <h2>Add Transaction</h2>

        <p>Accounting Voucher Entry</p>

    </div>


    <div class="transaction-box">


        <!-- DATE -->

        <label>Date</label>

        <input
            type="date"
            id="transactionDate"
        >


        <!-- PARTICULARS -->

        <label>Particulars</label>

        <input
            type="text"
            id="description"
            placeholder="Enter particulars"
        >


        <!-- MAIN CATEGORY -->

        <label>Main Category</label>

        <select
            id="category"
            onchange="loadSubCategories()"
        >

            <option value="">
                Loading Categories...
            </option>

        </select>


        <!-- SUB CATEGORY -->

        <label>Sub Category</label>

        <select
            id="subCategory"
            onchange="loadLedgers()"
        >

            <option value="">
                Select Main Category First
            </option>

        </select>


        <!-- LEDGER -->

        <label>Ledger Name</label>

        <select id="ledger">

            <option value="">
                Select Sub Category First
            </option>

        </select>


        <!-- ENTRY TYPE -->

        <label>Entry Type</label>

        <select id="entryType">

            <option value="">
                Select Debit / Credit
            </option>

            <option value="debit">
                Debit (Expense / Payment)
            </option>

            <option value="credit">
                Credit (Income / Received)
            </option>

        </select>


        <!-- AMOUNT -->

        <label>Amount</label>

        <input
            type="number"
            id="amount"
            placeholder="₹ Amount"
            min="0"
            step="0.01"
        >


        <!-- PAYMENT ACCOUNT -->

        <label>Cash / Bank Account</label>

        <select id="paymentAccount">

            <option value="">
                Loading Accounts...
            </option>

        </select>


        <!-- NOTES -->

        <label>Narration</label>

        <textarea
            id="notes"
            rows="3"
            placeholder="Enter narration"
        ></textarea>


    </div>


    <!-- BUTTONS -->

    <div class="report-buttons">


        <button
            id="saveButton"
            onclick="saveTransaction()"
        >
            SAVE TRANSACTION
        </button>


        <button onclick="clearForm()">
            CLEAR
        </button>


        <button onclick="goDashboard()">
            BACK TO DASHBOARD
        </button>


    </div>


    <p
        id="transactionMessage"
        class="transaction-message"
    ></p>


</div>


<script>


/* =====================================
   CURRENT USER
===================================== */

async function getCurrentUser() {

    const {

        data,

        error

    } =
        await supabaseClient
            .auth
            .getUser();


    if (
        error ||
        !data.user
    ) {

        console.error(
            "User Error:",
            error
        );

        return null;

    }


    return data.user;

}





/* =====================================
   TODAY DATE
===================================== */

function setTodayDate() {

    document.getElementById(
        "transactionDate"
    ).value =
        new Date()
            .toISOString()
            .split("T")[0];

}





/* =====================================
   LOAD ACCOUNTS
===================================== */

async function loadAccounts() {


    const select =
        document.getElementById(
            "paymentAccount"
        );


    select.innerHTML =
        '<option value="">Loading Accounts...</option>';


    const user =
        await getCurrentUser();


    if (!user) {

        select.innerHTML =
            '<option value="">Please login first</option>';

        return;

    }


    const {

        data,

        error

    } =
        await supabaseClient
            .from("accounts")
            .select("*")
            .eq(
                "user_id",
                user.id
            );


    if (error) {

        console.error(
            "Account Loading Error:",
            error
        );


        select.innerHTML =
            '<option value="">Error loading accounts</option>';

        return;

    }


    select.innerHTML =
        '<option value="">Select Cash / Bank Account</option>';


    if (
        !data ||
        data.length === 0
    ) {

        select.innerHTML +=
            '<option value="">No accounts found</option>';

        return;

    }


    data.forEach(
        function(account) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                account.id;


            const icon =
                account.account_type === "cash"
                    ? "💵"
                    : "🏦";


            option.text =
                icon +
                " " +
                account.name;


            select.appendChild(
                option
            );


        }
    );


}





/* =====================================
   LOAD MAIN CATEGORIES
===================================== */

async function loadCategories() {


    const select =
        document.getElementById(
            "category"
        );


    const {

        data,

        error

    } =
        await supabaseClient
            .from("categories")
            .select("*")
            .order("name");


    if (error) {

        console.error(error);

        select.innerHTML =
            '<option value="">Error Loading Categories</option>';

        return;

    }


    select.innerHTML =
        '<option value="">Select Main Category</option>';


    data.forEach(
        function(category) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                category.id;


            option.text =
                category.name;


            select.appendChild(
                option
            );


        }
    );


}





/* =====================================
   LOAD SUB CATEGORIES
===================================== */

async function loadSubCategories() {


    const categoryId =
        document.getElementById(
            "category"
        ).value;


    const subSelect =
        document.getElementById(
            "subCategory"
        );


    const ledgerSelect =
        document.getElementById(
            "ledger"
        );


    ledgerSelect.innerHTML =
        '<option value="">Select Sub Category First</option>';


    if (!categoryId) {

        subSelect.innerHTML =
            '<option value="">Select Main Category First</option>';

        return;

    }


    subSelect.innerHTML =
        '<option value="">Loading...</option>';


    const {

        data,

        error

    } =
        await supabaseClient
            .from("sub_categories")
            .select("*")
            .eq(
                "category_id",
                categoryId
            )
            .order("name");


    if (error) {

        console.error(error);

        subSelect.innerHTML =
            '<option value="">Error Loading Sub Categories</option>';

        return;

    }


    subSelect.innerHTML =
        '<option value="">Select Sub Category</option>';


    data.forEach(
        function(subCategory) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                subCategory.id;


            option.text =
                subCategory.name;


            subSelect.appendChild(
                option
            );


        }
    );


}





/* =====================================
   LOAD LEDGERS
===================================== */

async function loadLedgers() {


    const subCategoryId =
        document.getElementById(
            "subCategory"
        ).value;


    const ledgerSelect =
        document.getElementById(
            "ledger"
        );


    if (!subCategoryId) {

        ledgerSelect.innerHTML =
            '<option value="">Select Sub Category First</option>';

        return;

    }


    ledgerSelect.innerHTML =
        '<option value="">Loading...</option>';


    const {

        data,

        error

    } =
        await supabaseClient
            .from("ledgers")
            .select("*")
            .eq(
                "sub_category_id",
                subCategoryId
            )
            .order("name");


    if (error) {

        console.error(error);

        ledgerSelect.innerHTML =
            '<option value="">Error Loading Ledgers</option>';

        return;

    }


    ledgerSelect.innerHTML =
        '<option value="">Select Ledger</option>';


    data.forEach(
        function(ledger) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                ledger.name;


            option.text =
                ledger.name;


            ledgerSelect.appendChild(
                option
            );


        }
    );


}





/* =====================================
   SAVE TRANSACTION
===================================== */

async function saveTransaction() {


    const user =
        await getCurrentUser();


    if (!user) {

        alert(
            "Please login again."
        );

        return;

    }


    const date =
        document.getElementById(
            "transactionDate"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value
        .trim();


    const categorySelect =
        document.getElementById(
            "category"
        );


    const category =
        categorySelect
            .selectedOptions[0]
            ?.text;


    const subCategorySelect =
        document.getElementById(
            "subCategory"
        );


    const subCategory =
        subCategorySelect
            .selectedOptions[0]
            ?.text;


    const ledger =
        document.getElementById(
            "ledger"
        ).value;


    const entryType =
        document.getElementById(
            "entryType"
        ).value;


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    const paymentAccount =
        document.getElementById(
            "paymentAccount"
        ).value;


    const notes =
        document.getElementById(
            "notes"
        ).value
        .trim();


    const message =
        document.getElementById(
            "transactionMessage"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    if (

        !date ||
        !description ||
        !categorySelect.value ||
        !subCategorySelect.value ||
        !ledger ||
        !entryType ||
        !amount ||
        amount <= 0 ||
        !paymentAccount

    ) {

        message.innerText =
            "Please fill all required fields.";

        return;

    }


    saveButton.disabled =
        true;


    saveButton.innerText =
        "SAVING...";


    /* GET ACCOUNT DETAILS */

    const {

        data: account,

        error: accountError

    } =
        await supabaseClient
            .from("accounts")
            .select("*")
            .eq(
                "id",
                paymentAccount
            )
            .single();


    if (accountError) {

        console.error(accountError);

        message.innerText =
            "Account error: " +
            accountError.message;


        saveButton.disabled =
            false;


        saveButton.innerText =
            "SAVE TRANSACTION";


        return;

    }


    /* SAVE TRANSACTION */

    const {

        error

    } =
        await supabaseClient
            .from("transactions")
            .insert([

                {

                    user_id:
                        user.id,

                    transaction_date:
                        date,

                    description:
                        description,

                    category:
                        category,

                    sub_category:
                        subCategory,

                    ledger_name:
                        ledger,

                    entry_type:
                        entryType,

                    amount:
                        amount,

                    payment_account:
                        account.name,

                    notes:
                        notes || null

                }

            ]);


    if (error) {

        console.error(error);

        message.innerText =
            "Error: " +
            error.message;


        saveButton.disabled =
            false;


        saveButton.innerText =
            "SAVE TRANSACTION";


        return;

    }


    clearForm();


    message.innerText =
        "Transaction saved successfully!";


    saveButton.disabled =
        false;


    saveButton.innerText =
        "SAVE TRANSACTION";


}





/* =====================================
   CLEAR FORM
===================================== */

function clearForm() {


    setTodayDate();


    document.getElementById(
        "description"
    ).value =
        "";


    document.getElementById(
        "category"
    ).value =
        "";


    document.getElementById(
        "subCategory"
    ).innerHTML =
        '<option value="">Select Main Category First</option>';


    document.getElementById(
        "ledger"
    ).innerHTML =
        '<option value="">Select Sub Category First</option>';


    document.getElementById(
        "entryType"
    ).value =
        "";


    document.getElementById(
        "amount"
    ).value =
        "";


    document.getElementById(
        "paymentAccount"
    ).value =
        "";


    document.getElementById(
        "notes"
    ).value =
        "";


}





/* =====================================
   DASHBOARD
===================================== */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}





/* =====================================
   START
===================================== */

setTodayDate();

loadCategories();

loadAccounts();


</script>

</body>

</html>
