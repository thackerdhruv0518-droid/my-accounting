<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Transaction - My Accounting</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>


<body>


<div class="tally-report">


    <!-- HEADER -->

    <div class="report-header">

        <h1>MY ACCOUNTING</h1>

        <h2>Add Transaction</h2>

        <p>Accounting Voucher Entry</p>

    </div>



    <!-- FORM -->

    <div class="transaction-box">


        <!-- DATE -->

        <label for="transactionDate">
            Date
        </label>

        <input
            type="date"
            id="transactionDate"
        >



        <!-- PARTICULARS -->

        <label for="description">
            Particulars
        </label>

        <input
            type="text"
            id="description"
            placeholder="Enter particulars"
        >



        <!-- MAIN CATEGORY -->

        <label for="category">
            Main Category
        </label>

        <select
            id="category"
            onchange="loadSubCategories()"
        >

            <option value="">
                Loading Categories...
            </option>

        </select>



        <!-- SUB CATEGORY -->

        <label for="subCategory">
            Sub Category
        </label>

        <select id="subCategory">

            <option value="">
                Select Main Category First
            </option>

        </select>



        <!-- DEBIT / CREDIT -->

        <label for="entryType">
            Entry Type
        </label>

        <select id="entryType">

            <option value="">
                Select Debit / Credit
            </option>

            <option value="debit">
                Debit (Dr.)
            </option>

            <option value="credit">
                Credit (Cr.)
            </option>

        </select>



        <!-- AMOUNT -->

        <label for="amount">
            Amount
        </label>

        <input
            type="number"
            id="amount"
            placeholder="₹ Amount"
            min="0"
            step="0.01"
        >



        <!-- PAYMENT ACCOUNT -->

        <label for="paymentAccount">
            Cash / Bank / GPay
        </label>

        <select id="paymentAccount">

            <option value="">
                Select Account
            </option>

            <option value="Cash">
                Cash
            </option>

            <option value="Bank">
                Bank
            </option>

            <option value="GPay">
                GPay
            </option>

        </select>



        <!-- NARRATION -->

        <label for="notes">
            Narration
        </label>

        <textarea
            id="notes"
            placeholder="Enter narration"
            rows="3"
        ></textarea>


    </div>



    <!-- BUTTONS -->

    <div class="report-buttons">


        <button
            id="saveButton"
            onclick="saveTransaction()"
        >
            SAVE TRANSACTION
        </button>


        <button onclick="clearForm()">
            CLEAR
        </button>


        <button onclick="goDashboard()">
            BACK TO DASHBOARD
        </button>


    </div>



    <!-- MESSAGE -->

    <p
        id="transactionMessage"
        class="transaction-message"
    ></p>


</div>



<script>


/* =========================================
   GLOBAL CATEGORIES
========================================= */

let categories = [];



/* =========================================
   SET TODAY DATE
========================================= */

document.getElementById(
    "transactionDate"
).value =
    new Date()
        .toISOString()
        .split("T")[0];



/* =========================================
   LOAD MAIN CATEGORIES
========================================= */

async function loadCategories() {


    const categorySelect =
        document.getElementById(
            "category"
        );


    categorySelect.innerHTML = `

        <option value="">
            Loading Categories...
        </option>

    `;


    const {

        data,

        error

    } = await supabaseClient

        .from("categories")

        .select("*")

        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {


        console.error(
            "Category Error:",
            error
        );


        categorySelect.innerHTML = `

            <option value="">
                Error Loading Categories
            </option>

        `;


        return;

    }


    categories =
        data || [];


    categorySelect.innerHTML = `

        <option value="">
            Select Main Category
        </option>

    `;


    if (
        categories.length === 0
    ) {


        categorySelect.innerHTML += `

            <option value="">
                No Categories Found
            </option>

        `;


        return;

    }


    categories.forEach(
        function(category) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                category.id;


            option.text =
                category.name;


            categorySelect.appendChild(
                option
            );


        }
    );


}



/* =========================================
   LOAD SUB CATEGORIES
========================================= */

async function loadSubCategories() {


    const categoryId =
        document.getElementById(
            "category"
        ).value;


    const subCategorySelect =
        document.getElementById(
            "subCategory"
        );


    /* RESET */

    subCategorySelect.innerHTML = `

        <option value="">
            Loading Sub Categories...
        </option>

    `;


    /* NO CATEGORY SELECTED */

    if (!categoryId) {


        subCategorySelect.innerHTML = `

            <option value="">
                Select Main Category First
            </option>

        `;


        return;

    }


    /* GET SUB CATEGORIES */

    const {

        data,

        error

    } = await supabaseClient

        .from("sub_categories")

        .select("*")

        /*
        IMPORTANT:

        YOUR DATABASE COLUMN IS:

        catagory_id

        NOT:

        category_id
        */

        .eq(
            "catagory_id",
            categoryId
        )

        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {


        console.error(
            "Sub Category Error:",
            error
        );


        subCategorySelect.innerHTML = `

            <option value="">
                Error Loading Sub Categories
            </option>

        `;


        return;

    }


    subCategorySelect.innerHTML = `

        <option value="">
            Select Sub Category
        </option>

    `;


    if (
        !data ||
        data.length === 0
    ) {


        subCategorySelect.innerHTML += `

            <option value="">
                No Sub Categories Found
            </option>

        `;


        return;

    }


    data.forEach(
        function(subCategory) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                subCategory.name;


            option.text =
                subCategory.name;


            subCategorySelect.appendChild(
                option
            );


        }
    );


}



/* =========================================
   GET CATEGORY NAME
========================================= */

function getCategoryName() {


    const categoryId =
        document.getElementById(
            "category"
        ).value;


    const category =
        categories.find(
            function(item) {


                return (
                    String(item.id) ===
                    String(categoryId)
                );


            }
        );


    if (category) {


        return category.name;

    }


    return "";


}



/* =========================================
   SAVE TRANSACTION
========================================= */

async function saveTransaction() {


    const date =
        document.getElementById(
            "transactionDate"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const category =
        getCategoryName();


    const categoryId =
        document.getElementById(
            "category"
        ).value;


    const subCategory =
        document.getElementById(
            "subCategory"
        ).value;


    const entryType =
        document.getElementById(
            "entryType"
        ).value;


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    const paymentAccount =
        document.getElementById(
            "paymentAccount"
        ).value;


    const notes =
        document.getElementById(
            "notes"
        ).value.trim();


    const message =
        document.getElementById(
            "transactionMessage"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    /* VALIDATION */

    if (
        !date ||
        !description ||
        !categoryId ||
        !category ||
        !subCategory ||
        !entryType ||
        !amount ||
        amount <= 0 ||
        !paymentAccount
    ) {


        message.innerText =
            "Please fill all required fields.";


        return;

    }


    saveButton.disabled =
        true;


    saveButton.innerText =
        "SAVING...";


    message.innerText =
        "";


    try {


        const {

            data,

            error

        } = await supabaseClient

            .from("transactions")

            .insert([

                {

                    transaction_date:
                        date,

                    description:
                        description,

                    category:
                        category,

                    sub_category:
                        subCategory,

                    entry_type:
                        entryType,

                    amount:
                        amount,

                    payment_account:
                        paymentAccount,

                    notes:
                        notes || null

                }

            ])

            .select();


        if (error) {


            console.error(
                "Supabase Error:",
                error
            );


            message.innerText =
                "Error: " +
                error.message;


            return;

        }


        console.log(
            "Transaction Saved:",
            data
        );


        clearForm();


        message.innerText =
            "Transaction saved successfully!";


    }

    catch (error) {


        console.error(
            error
        );


        message.innerText =
            "Something went wrong. Please try again.";

    }

    finally {


        saveButton.disabled =
            false;


        saveButton.innerText =
            "SAVE TRANSACTION";

    }


}



/* =========================================
   CLEAR FORM
========================================= */

function clearForm() {


    document.getElementById(
        "transactionDate"
    ).value =
        new Date()
            .toISOString()
            .split("T")[0];


    document.getElementById(
        "description"
    ).value =
        "";


    document.getElementById(
        "category"
    ).value =
        "";


    document.getElementById(
        "subCategory"
    ).innerHTML = `

        <option value="">
            Select Main Category First
        </option>

    `;


    document.getElementById(
        "entryType"
    ).value =
        "";


    document.getElementById(
        "amount"
    ).value =
        "";


    document.getElementById(
        "paymentAccount"
    ).value =
        "";


    document.getElementById(
        "notes"
    ).value =
        "";


}



/* =========================================
   BACK TO DASHBOARD
========================================= */

function goDashboard() {


    window.location.href =
        "dashboard.html";


}



/* =========================================
   START
========================================= */

loadCategories();


</script>


</body>

</html>
